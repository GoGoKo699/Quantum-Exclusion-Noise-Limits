name: Scientific verification

on:
  push:
    branches: [main, merlin/watrous-furnishing]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned scientific dependencies
        run: python -m pip install -r verification/requirements.txt
      - name: Run finite scientific checks
        run: python verification/verify.py --output "$RUNNER_TEMP/evidence/science.json"
      - name: Export inspected source and revision
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/evidence/tree.txt"
          git archive --format=zip --output="$RUNNER_TEMP/evidence/source.zip" HEAD
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
